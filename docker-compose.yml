# Optional helper: spins up a local PostgreSQL instance for development.
# Usage:  docker compose up -d
# Stop :  docker compose down          (data is kept in the named volume)
# Nuke :  docker compose down -v       (deletes the data volume too)

services:
  postgres:
    image: postgres:16-alpine
    container_name: store_rating_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: store_rating
    ports:
      # host:container - change the host port if 5432 is already busy on your machine
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d store_rating"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
